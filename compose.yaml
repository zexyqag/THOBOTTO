services:
  bot:
    image: ghcr.io/zexyqag/thobotto:latest
    restart: unless-stopped
    environment:
      Discord__Token: ${DISCORD_TOKEN:?}
      ConnectionStrings__Postgres: Host=postgres;Database=thobotto;Username=thobotto;Password=${POSTGRES_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: thobotto
      POSTGRES_USER: thobotto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thobotto -d thobotto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
