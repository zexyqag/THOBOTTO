name: image

on:
  # Branches and pull requests are built, checked and started, not pushed; a release tag (v0.1.0) gets its version,
  # :latest and :main. Dependabot's branches are built once, as their pull requests, not again for their pushes.
  push:
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: the one selected above). Releases are built by pushing their tag; a manual run builds the ref as a branch build, versioned and tagged after the branch the run is started from."
        required: false
        type: string
      push:
        description: "Push the image to GHCR (false only builds and checks it)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Pushing main and a release tag together is two push events. The tag's run builds the commit (and tags :main
  # too), so the main push's run steps aside when the commit carries a release tag.
  main-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      released: ${{ steps.tags.outputs.released }}
    steps:
      - id: tags
        run: |
          if git ls-remote --tags "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" | grep -Eq "^$GITHUB_SHA[[:space:]]+refs/tags/v"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: main-push
    if: ${{ !cancelled() && needs.main-push.outputs.released != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the database tests: a server of their own to make and drop databases on.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The sound tests decode Opus with the same native library the bot uses.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev
      - run: dotnet format THOBOTTO.slnx --verify-no-changes
      - run: dotnet test THOBOTTO.slnx

  image:
    needs: test
    # Spelled out, as the default (every job before it succeeded) counts main-push's skip on other events as a reason to skip.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # Pushes release tags, and manual runs that ask for it; branches and pull requests only build, check and start.
      PUSH: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      # A bot of its own in the test server, for starting the image below. Dependabot's pull requests read their own copy
      # (a Dependabot secret); forks' pull requests don't see it.
      CI_BOT_TOKEN: ${{ secrets.CI_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The tags, to find the release before this build.
          fetch-depth: 0

      # The image is named after the repository, lowercased as registries require.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The build's version: a release tag's number; otherwise a prerelease naming the branch (or pull request) and the
      # commit, with git's g in front of the hash: a part of digits alone must not start with a zero (NETSDK1018 on a
      # hash like 0936791).
      - name: Version
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$PR" ]; then
            version="0.0.0-pr$PR.g${GITHUB_SHA::7}"
          else
            version="0.0.0-$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'A-Za-z0-9' '-').g${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ci:test
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE=${{ github.repository }}
          cache-from: type=gha
      # An unroutable address: getting GameDig's JSON error back proves Node and GameDig run on the chiseled base.
      - name: GameDig runs in the image
        run: |
          docker run --rm --entrypoint node ci:test \
            /opt/gamedig/node_modules/gamedig/bin/gamedig.js --type minecraft 192.0.2.1 --maxRetries 1 --socketTimeout 500 --attemptTimeout 1000 \
            | tee /dev/stderr | grep -q '"error"'

      # Opus, libsodium, libdave and Whisper load in the chiseled image (voice commands).
      - name: Voice libraries load in the image
        run: docker run --rm --entrypoint dotnet ci:test THOBOTTO.dll --check-voice
      # The image runs as a bot before anything is pushed: the previous release on an empty database, then this build
      # on top of it (its migrations over the previous schema), each until its health answers. Skipped without the
      # CI_BOT_TOKEN secret, with a notice.
      - name: The release before this build
        if: env.CI_BOT_TOKEN != ''
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$GITHUB_REF_NAME" 2>/dev/null || true)
          echo "PREVIOUS=${previous#v}" >> "$GITHUB_ENV"
          echo "previous release: ${previous:-none}"
      - name: A database for the bot
        if: env.CI_BOT_TOKEN != ''
        run: |
          docker run -d --name postgres --network host -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=thobotto postgres:18 >/dev/null
          for i in $(seq 1 30); do docker exec postgres pg_isready -q -U postgres && break; sleep 1; done
          docker exec postgres pg_isready -U postgres
      - name: The previous release runs
        if: env.CI_BOT_TOKEN != '' && env.PREVIOUS != ''
        run: .github/run-image.sh "${IMAGE}:${PREVIOUS}" "$PREVIOUS"
      - name: This build runs on its database
        if: env.CI_BOT_TOKEN != ''
        run: .github/run-image.sh ci:test "$VERSION"
      - name: Not started
        if: env.CI_BOT_TOKEN == ''
        run: echo "::notice::The image wasn't started as a bot (no CI_BOT_TOKEN here)."

      # Known vulnerabilities in the image: every finding goes to the Security tab, and one rated high or critical that
      # has a fix stops the build before anything is pushed. Pinned to a commit: the action's tags were rewritten in a
      # supply chain attack (March 2026).
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci:test
          format: sarif
          output: trivy.sarif
      - name: Findings to the Security tab
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image
      - name: No fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ci:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # A release commit on main gets :main as well, since the release's run builds in place of the main push's.
      - id: on-main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status)
          echo "yes=$([ "$status" = identical ] || [ "$status" = behind ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # A release is tagged with its version, :latest and :main; floating :X and :X.Y only once past 0.x. Branches
      # get :<branch> and :<branch>-<sha>, pull requests :pr-N and :sha-<sha>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=main,enable=${{ steps.on-main.outputs.yes == 'true' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release tag gets a GitHub Release whose notes are the commit subjects since the release before. Production is
  # deployed by hand afterwards (Pull and redeploy in Portainer); a prerelease (a tag with a dash) doesn't move :latest.
  release:
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: |
          # GitHub can run one push twice; the second run finds the Release made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME exists"; exit 0; fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
