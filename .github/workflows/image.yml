name: image

on:
  # Every branch gets an image named after it (thobotto:<branch>); a release tag (v0.1.0) gets its version and :latest.
  # Dependabot's branches are built once, as their pull requests, not again for their pushes.
  push:
    branches-ignore: ["dependabot/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: the one selected above). Releases are built by pushing their tag; a manual run builds the ref as a branch build, versioned and tagged after the branch the run is started from."
        required: false
        type: string
      push:
        description: "Push the image to GHCR (false only builds and checks it)"
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # For the database tests: a server of their own to make and drop databases on.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet format THOBOTTO.slnx --verify-no-changes
      - run: dotnet test THOBOTTO.slnx

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Pushes on branches and tags, and manual runs that ask for it; pull requests only build.
      PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The image is named after the repository, lowercased as registries require.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The build's version: a release tag's number; otherwise a prerelease naming the branch (or pull request) and the commit.
      - name: Version
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$PR" ]; then
            version="0.0.0-pr$PR.${GITHUB_SHA::7}"
          else
            version="0.0.0-$(printf '%s' "$GITHUB_REF_NAME" | tr -cs 'A-Za-z0-9' '-').${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ci:test
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE=${{ github.repository }}
          cache-from: type=gha
      # An unroutable address: getting GameDig's JSON error back proves Node and GameDig run on the chiseled base.
      - name: GameDig runs in the image
        run: |
          docker run --rm --entrypoint node ci:test \
            /opt/gamedig/node_modules/gamedig/bin/gamedig.js --type minecraft 192.0.2.1 --maxRetries 1 --socketTimeout 500 --attemptTimeout 1000 \
            | tee /dev/stderr | grep -q '"error"'

      # Opus, libsodium, libdave and Whisper load in the chiseled image (voice commands).
      - name: Voice libraries load in the image
        run: docker run --rm --entrypoint dotnet ci:test THOBOTTO.dll --check-voice

      # A release is tagged with its version and :latest; floating :X and :X.Y only once past 0.x. Branches get
      # :<branch> and :<branch>-<sha>, pull requests :pr-N and :sha-<sha>.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' && github.event_name != 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release tag gets a GitHub Release whose notes are the commit subjects since the release before.
  release:
    needs: image
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: |
          # GitHub can run one push twice; the second run finds the Release made.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release $GITHUB_REF_NAME exists"; exit 0; fi
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format='- %s' ${previous:+$previous..}"$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
