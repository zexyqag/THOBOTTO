version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src", "/tests/THOBOTTO.Tests"]
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /activity
    schedule:
      interval: weekly
    groups:
      activity:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /gamedig
    schedule:
      interval: weekly
    ignore:
      # Majors rename game ids and change results; upgrade those by hand.
      - dependency-name: gamedig
        update-types: [version-update:semver-major]
