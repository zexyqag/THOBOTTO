version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src/THOBOTTO", "/tests/THOBOTTO.Tests", "/tests/THOBOTTO.DatabaseTests"]
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's odd majors aren't LTS; the even ones are moved to by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /src/activity
    schedule:
      interval: weekly
    groups:
      activity:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /src/gamedig
    schedule:
      interval: weekly
    ignore:
      # Majors rename game ids and change results; upgrade those by hand.
      - dependency-name: gamedig
        update-types: [version-update:semver-major]
